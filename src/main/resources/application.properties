spring.application.name=IncidentHub
spring.profiles.active=dev

# PostgreSQL Configuration (Production)
spring.datasource.url=jdbc:postgresql://localhost:5432/incidenthub
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwt.secret=IncidentHubSecretKeyForJWTTokenGenerationMustBe256BitsLong!!
app.jwt.expiration=86400000

# Server
server.port=8080

# Logging
logging.level.com.incidenthub=INFO
logging.level.org.springframework.security=WARN

# Actuator - Load Balancer Health Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Rate Limiter Defaults
app.ratelimit.enabled=true
